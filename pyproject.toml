[project]
name = "xd-random-walk"
version = "0.1.0"
description = "Visualization of random walk in n dimensions"
readme = "README.md"
authors = [
    { name = "Rafał Mazur", email = "raf.mazur.000@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
]

[project.scripts]
walk="xd_random_walk.__main__:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"